<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video Translator</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="card">
    <header>
      <h1>Video Translator</h1>
      <p class="subtitle">Paste a video link — or just describe what you want — and get back the translated video. Powered by the ElevenLabs Dubbing API.</p>
    </header>

    <div id="setup-warning" class="notice warn hidden" role="alert"></div>

    <label id="password-field" class="field hidden">
      <span>Password</span>
      <input type="password" id="password" autocomplete="current-password" placeholder="Shared password">
    </label>

    <div class="tabs" role="tablist">
      <button type="button" id="tab-form" class="tab active" role="tab" aria-selected="true">Form</button>
      <button type="button" id="tab-chat" class="tab hidden" role="tab" aria-selected="false">Chat</button>
    </div>

    <form id="dub-form">
      <label class="field">
        <span>Video URL</span>
        <input type="url" id="url" placeholder="https://youtu.be/…" required>
      </label>

      <label class="field">
        <span>Translate into</span>
        <select id="to" required></select>
      </label>

      <details class="advanced">
        <summary>Advanced options</summary>
        <div class="grid">
          <label class="field">
            <span>Source language</span>
            <select id="source-lang"></select>
          </label>
          <label class="field">
            <span>Speakers (0 = auto-detect)</span>
            <input type="number" id="speakers" value="0" min="0" max="20">
          </label>
          <label class="check">
            <input type="checkbox" id="no-clone">
            <span>Use a similar library voice instead of cloning the speaker</span>
          </label>
          <label class="check">
            <input type="checkbox" id="watermark">
            <span>Allow a watermark if the account plan requires one</span>
          </label>
        </div>
      </details>

      <button type="submit" id="submit">Translate</button>
    </form>

    <section id="chat-panel" class="hidden">
      <div id="chat-messages" aria-live="polite"></div>
      <form id="chat-form">
        <label class="field">
          <span>What do you need?</span>
          <textarea id="chat-input" rows="2" maxlength="4000" placeholder="e.g. Dub this video into Tamil: https://youtu.be/…"></textarea>
        </label>
        <button type="submit" id="chat-send">Send</button>
      </form>
    </section>

    <section id="progress" class="hidden" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <div>
        <p id="status-line">Starting…</p>
        <p id="status-detail" class="muted"></p>
      </div>
    </section>

    <section id="result" class="hidden">
      <h2>Your translated video</h2>

      <div id="mp4-block">
        <div id="mp4-progress" class="hidden">
          <div class="spinner" aria-hidden="true"></div>
          <p id="mp4-status" class="muted"></p>
        </div>
        <div id="mp4-result" class="hidden">
          <video id="mp4-player" controls playsinline></video>
          <a id="mp4-download" class="button" download>Download MP4</a>
        </div>
        <div id="mp4-failed" class="hidden">
          <p id="mp4-error" class="muted"></p>
          <button type="button" id="mp4-button">Build the translated video</button>
        </div>
      </div>

      <details id="audio-only">
        <summary>Audio only (MP3)</summary>
        <div class="grid">
          <audio id="player" controls></audio>
          <a id="download" class="button" download>Download MP3</a>
        </div>
      </details>
    </section>

    <div id="error" class="notice error hidden" role="alert"></div>
  </main>
  <script src="/app.js"></script>
</body>
</html>
